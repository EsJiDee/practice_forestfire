<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWI Prediction Portal</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #1e1e24 0%, #2a2a35 100%);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 2rem 0;
      }

      .container {
        background-color: #23232c;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        border: 1px solid #3a3a4a;
        max-width: 700px;
        width: 90%;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
        color: #ff6b4a;
        text-align: center;
      }

      /* 3-Column Responsive Grid Layout */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.2rem;
        margin-bottom: 1.5rem;
      }

      @media (max-width: 600px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        font-size: 0.85rem;
        color: #b0b0bc;
        margin-bottom: 0.4rem;
        font-weight: 500;
      }

      input[type="text"] {
        width: 100%;
        padding: 0.75rem;
        background-color: #1a1a20;
        border: 1px solid #4a4a5a;
        border-radius: 6px;
        color: #ffffff;
        font-size: 0.95rem;
        transition:
          border-color 0.3s ease,
          box-shadow 0.3s ease;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #ff6b4a;
        box-shadow: 0 0 0 3px rgba(255, 107, 74, 0.2);
      }

      .btn-predict {
        width: 100%;
        background-color: #ff6b4a;
        color: white;
        border: none;
        padding: 0.9rem;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          transform 0.2s ease;
        box-shadow: 0 4px 12px rgba(255, 107, 74, 0.2);
        margin-top: 0.5rem;
      }

      .btn-predict:hover {
        background-color: #e55a39;
        transform: translateY(-2px);
      }

      .btn-predict:active {
        transform: translateY(0);
      }

      .result-box {
        margin-top: 2rem;
        padding: 1.2rem;
        background-color: rgba(255, 107, 74, 0.1);
        border: 1px solid rgba(255, 107, 74, 0.3);
        border-radius: 6px;
        text-align: center;
      }

      .result-box h2 {
        font-size: 1.3rem;
        color: #ff8c73;
      }

      .result-value {
        font-size: 1.8rem;
        font-weight: 700;
        color: #ffffff;
        display: block;
        margin-top: 0.5rem;
      }

      .nav-link {
        display: block;
        text-align: center;
        margin-top: 1.5rem;
        color: #b0b0bc;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.3s ease;
      }

      .nav-link:hover {
        color: #ff6b4a;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>FWI Prediction</h1>

      <form action="{{ url_for('predict_datapoint') }}" method="post">
        <div class="form-grid">
          <div class="form-group">
            <label>Temperature</label>
            <input
              type="text"
              name="Temperature"
              placeholder="e.g. 32.5"
              required
            />
          </div>
          <div class="form-group">
            <label>Relative Humidity (RH)</label>
            <input type="text" name="RH" placeholder="e.g. 57" required />
          </div>
          <div class="form-group">
            <label>Wind Speed (Ws)</label>
            <input type="text" name="Ws" placeholder="e.g. 14" required />
          </div>
          <div class="form-group">
            <label>Rain</label>
            <input type="text" name="Rain" placeholder="e.g. 0.2" required />
          </div>
          <div class="form-group">
            <label>FFMC</label>
            <input type="text" name="FFMC" placeholder="e.g. 78.3" required />
          </div>
          <div class="form-group">
            <label>DMC</label>
            <input type="text" name="DMC" placeholder="e.g. 12.4" required />
          </div>
          <div class="form-group">
            <label>ISI</label>
            <input type="text" name="ISI" placeholder="e.g. 4.1" required />
          </div>
          <div class="form-group">
            <label>Classes</label>
            <input
              type="text"
              name="Classes"
              placeholder="e.g. 0 or 1"
              required
            />
          </div>
          <div class="form-group">
            <label>Region</label>
            <input
              type="text"
              name="Region"
              placeholder="e.g. 0 or 1"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-predict">Predict</button>
      </form>

      <!-- Conditional block renders only when a result exists -->
      {% if result is not none %}
      <div class="result-box">
        <h2>
          The FWI prediction is: <span class="result-value">{{ result }}</span>
        </h2>
      </div>
      {% endif %}

      <a href="/" class="nav-link">← Back to Welcome Page</a>
    </div>
  </body>
</html>
