<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algerian Forest Fire Predictor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e24 0%, #2a2a35 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background-color: #23232c;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3a4a;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: #ff6b4a;
        }

        p {
            font-size: 1rem;
            color: #b0b0bc;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #ff6b4a;
            color: white;
            text-decoration: none;
            padding: 0.8rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 107, 74, 0.2);
        }

        .btn:hover {
            background-color: #e55a39;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Algerian Forest Fire Predictor</h1>
        <p>Welcome to the analysis portal. Use our trained machine learning model to estimate the fire risk index based on atmospheric metrics.</p>
        <a href="/predictdata" class="btn">Go to Prediction Page</a>
    </div>

</body>
</html>
